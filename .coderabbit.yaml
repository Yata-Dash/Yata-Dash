# CodeRabbit configuration.
#
# Review happens at the feature -> dev boundary, where each diff is one focused
# change. By the time code reaches dev -> main it has already been reviewed, so
# that merge is a promotion rather than a second review.
#
# Schema reference: https://docs.coderabbit.ai/guides/configure-coderabbit
language: en-GB

reviews:
  # Fewer stylistic nitpicks, so the comments that do appear are worth reading.
  profile: chill

  # CodeRabbit advises; CI blocks. Letting a bot request changes would make it a
  # gate on a solo-maintained repo without the judgement to be one.
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  poem: false

  auto_review:
    enabled: true
    # Drafts are work in progress — reviewing them wastes the budget on code
    # that is about to change anyway.
    drafts: false
    base_branches:
      - main
      - dev

  path_filters:
    # Generated by npm, not written by a person. The last dependency bump was a
    # 389-line diff here saying nothing the two-line package.json change did not.
    - '!web/package-lock.json'
    # Build output (gitignored, but excluded defensively in case that changes).
    - '!static/dashboard.js'
    - '!static/fontawesome/**'
    # Binary assets.
    - '!docs/screenshots/**'

  path_instructions:
    - path: 'defs/**/*.json'
      instructions: >-
        Tracker definitions are DATA that changes what the server does, and they
        arrive from contributors. Pay attention to `api.base_url`: it overrides
        the tracker URL the user configured, so it is the one field in a
        definition that decides where the server sends a request. It must be a
        public internet address — never loopback, RFC1918 (10.x, 192.168.x,
        172.16-31.x), link-local (169.254.x, especially 169.254.169.254), or
        carrier-grade NAT / Tailscale (100.64.x). Flag any definition whose
        `base_url` host does not plainly belong to the tracker it claims to
        describe. Also flag scrape selectors or paths that would collect more
        than the account's own statistics.

    - path: 'internal/**/*.go'
      instructions: >-
        Flag anything that could put a credential where a person other than the
        account holder could read it: an API key, session cookie, passkey or
        webhook token reaching a log line, an API error body, or an HTTP
        response. Go's *url.Error renders the full request URL in its message,
        so logging a transport error with %v leaks any credential carried in
        the URL — those must pass through internal/redact. New outbound HTTP
        clients should be built through internal/netguard with the narrowest
        policy that works, and a destination's raw response body must never be
        returned to the caller.

    - path: 'web/src/**/*.ts'
      instructions: >-
        Flag values interpolated into HTML without escaping, particularly
        tracker IDs, names and URLs, which can originate from an imported
        config file rather than from the server.

chat:
  auto_reply: true
